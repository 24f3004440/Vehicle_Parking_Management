{% extends "base.html" %}

{% block title %}Register - ParkEasy{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow border-0">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <div class="parking-icon">🅿️</div>

                    <h3 class="fw-bold mt-2">
                        Create Account
                    </h3>

                    <p class="text-muted">
                        Register for vehicle parking
                    </p>

                </div>


                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter Password"
                            minlength="1"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm your password"
                            required
                        >
                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100 py-2">
                        Create Account
                    </button>

                </form>


                <div class="text-center mt-4">

                    <span class="text-muted">
                        Already have an account?
                    </span>

                    <a href="{{ url_for('auth.login') }}">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
